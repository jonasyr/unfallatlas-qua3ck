[build-system]
build-backend = "hatchling.build"

requires = [
  "hatchling",
]

[project]
name = "unfallatlas-qua3ck"
version = "0.1.0"
description = "ML-Portfolio: Verkehrsunfallschwere-Klassifikation auf dem deutschen Unfallatlas (QUA³CK-Framework)"
readme = "README.md"
license = { text = "MIT" }

requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "catboost>=1.2",
  "duckdb>=1.1",
  "folium>=0.17",
  "holidays>=0.48",
  "imbalanced-learn>=0.12",
  "ipykernel>=6",
  "lightgbm>=4.3",
  "nbformat>=4.2",
  "optuna>=3.6",
  "pandas>=2.2",
  "pip>=23",
  "plotly>=5.22",
  "polars>=1",
  "pyarrow>=16",
  "requests>=2.32",
  "scikit-learn>=1.4",
  "scipy>=1.13",
  "shap>=0.45",
  "streamlit>=1.35",
  "streamlit-folium>=0.20",
  "tqdm>=4.66",
  "xgboost>=2",
]

optional-dependencies.dev = [
  "black>=24",
  "ipywidgets>=8",
  "jupyter>=1",
  "jupyterlab>=4",
  "nbstripout>=0.7",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
]
optional-dependencies.geo = [
  "geopandas>=1",
  "h3>=4",
  "osmnx>=1.9",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/unfallatlas",
]

[tool.black]
line-length = 100
target-version = [
  "py311",
]

[tool.ruff]
target-version = "py311"
line-length = 100
builtins = [
  "display",
]

lint.select = [
  "E",
  "F",
  "I",
  "UP",
]
lint.ignore = [
  "E501",
]

lint.isort.known-first-party = [
  "unfallatlas",
]

[tool.pytest.ini_options]
addopts = "--cov=src/unfallatlas --cov-report=xml --cov-report=term-missing"

[tool.jupytext]
formats = "ipynb,py:percent"

[dependency-groups]
dev = [
  "jupytext>=1.19.3",
]
