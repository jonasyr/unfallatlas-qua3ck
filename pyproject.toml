[project]
name = "unfallatlas-qua3ck"
version = "0.1.0"
description = "ML-Portfolio: Verkehrsunfallschwere-Klassifikation auf dem deutschen Unfallatlas (QUA³CK-Framework)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "shap>=0.45",
    "optuna>=3.6",
    "imbalanced-learn>=0.12",
    "folium>=0.17",
    "streamlit>=1.35",
    "streamlit-folium>=0.20",
    "plotly>=5.22",
    "holidays>=0.48",
    "requests>=2.32",
    "tqdm>=4.66",
    "ipykernel>=6.0",
    "pip>=23.0",
    "nbformat>=4.2.0",
]

[project.optional-dependencies]
geo = [
    "h3>=4.0",
    "osmnx>=1.9",
]
dev = [
    "ruff>=0.4",
    "black>=24.0",
    "nbstripout>=0.7",
    "pytest>=8.0",
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unfallatlas"]
